{%- assign L = page.lang | default: site.lang -%}
{%- assign ui = site.data.ui[L] -%}
<footer class="site-footer">
  <div class="wrapper">
    <p>
      <a href="{{ site.instagram_url }}" target="_blank" rel="noopener">{{ ui.instagram }}</a>
      <a href="mailto:{{ site.email }}">{{ site.email }}</a>
      <a href="{{ site.petition_url }}" target="_blank" rel="noopener">{{ ui.petition }}</a>
    </p>
    <p>{{ ui.footer_blurb }}</p>
    <p>{{ ui.footer_disclaimer }}</p>
  </div>
</footer>
<script src="{{ '/assets/js/prefs.js' | relative_url }}" defer></script>
